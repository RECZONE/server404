name: release
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: update which puzzles are open
        env:
          TOKENS: ${{ secrets.TOKENS }}
        run: python3 .github/release.py
      - name: commit and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A r
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "release update"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
