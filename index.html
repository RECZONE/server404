<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>server404 // archive</title>
<style>
:root{--a:#e8a33d;--ln:#2b3036;--tx:#b8bec4;--dim:#69727a;--ok:#7fd18b;--bad:#e0605a}
*{box-sizing:border-box}
html,body{margin:0;background:#0a0c0e;color:var(--tx);font:14px/1.65 Consolas,Menlo,"DejaVu Sans Mono",monospace;letter-spacing:.02em}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:40px 40px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;opacity:.2;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 3px)}
a{color:var(--a)}
#top{position:relative;z-index:2;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--ln);background:rgba(10,12,14,.92)}
#top h1{font-size:14px;font-weight:normal;letter-spacing:.18em;color:#e9edf0;margin:0}#top h1 i{display:inline-block;width:9px;height:9px;background:var(--a);margin-right:10px}
.tag{color:var(--ok);font-size:11px;letter-spacing:.2em;border:1px solid var(--ok);padding:1px 8px}
#top .sp{flex:1}#top label{color:var(--dim);font-size:12px;cursor:pointer}
#wrap{position:relative;z-index:1;display:grid;grid-template-columns:230px 1fr;max-width:1280px;margin:0 auto}
nav{padding:16px 12px;border-right:1px solid var(--ln);position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
nav a{display:block;text-decoration:none;color:var(--dim);padding:7px 10px;border-left:2px solid transparent;font-size:13px}
nav a b{color:var(--a);font-weight:normal;display:inline-block;width:26px}
nav a:hover{color:#e9edf0}nav a.on{color:#e9edf0;border-left-color:var(--a);background:rgba(232,163,61,.07)}
main{padding:22px 26px 80px;min-width:0}
h2{margin:0 0 4px;font-size:26px;letter-spacing:.12em;color:#e9edf0;font-weight:normal}h2 i{color:var(--a);font-style:normal}
.sub{color:var(--dim);font-size:12px;letter-spacing:.16em;margin-bottom:18px}
.sec{position:relative;border:1px solid var(--ln);background:rgba(10,12,14,.82);padding:26px 16px 16px;margin:0 0 20px}
.sec::before,.sec::after{content:"";position:absolute;width:13px;height:13px;border:2px solid var(--a)}
.sec::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.sec::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.sec>.lab{position:absolute;left:14px;top:7px;font-size:10px;letter-spacing:.2em;color:var(--dim)}
.sec>.lab em{color:var(--a);font-style:normal}
.hide .sol>*:not(.lab){filter:blur(9px);pointer-events:none;user-select:none}.hide .sol::after{pointer-events:none}.hide .sol{cursor:pointer}.hide .sol.rev>*:not(.lab){filter:none;pointer-events:auto;user-select:auto}
.hide .sol:not(.rev)>.lab::after{content:"  (click to reveal)";color:var(--a)}
.ans{display:inline-block;border:1px solid var(--ok);color:var(--ok);padding:4px 14px;letter-spacing:.24em;font-size:18px;margin:6px 0 2px}
img,video{max-width:100% !important;height:auto;display:block}audio{width:100%}
.cap{color:var(--dim);font-size:12px;margin:6px 0 14px}
ol.st{padding-left:22px;margin:8px 0}ol.st li{margin:0 0 9px}
table{border-collapse:collapse;width:100%;margin:8px 0}td,th{border-bottom:1px solid var(--ln);padding:5px 8px;text-align:left;vertical-align:top}th{color:var(--dim);font-weight:normal;font-size:11px;letter-spacing:.14em}
.poem{white-space:pre-line;border-left:2px solid var(--a);padding:4px 0 4px 14px;color:#cfd5da}.poem b{color:var(--a)}
button,.btn{background:transparent;color:var(--a);border:1px solid var(--a);padding:5px 12px;font:inherit;letter-spacing:.1em;cursor:pointer;margin:0 6px 6px 0}button:hover,.btn:hover{background:var(--a);color:#0a0c0e}
input[type=text],textarea{background:#0e1114;color:#e9edf0;border:1px solid #3a4148;padding:6px 10px;font:inherit;width:100%}input[type=range]{width:min(420px,100%)}
iframe{width:100%;border:1px solid var(--ln);background:#0a0c0e;display:block}
.row{display:flex;gap:18px;flex-wrap:wrap}.row>*{flex:1;min-width:250px}
.dim{color:var(--dim)}.ok{color:var(--ok)}.bad{color:var(--bad)}code{background:#14181c;padding:0 5px;color:#e9edf0}
.sg,.pp{display:inline-block;cursor:pointer;border:1px solid var(--ln);margin:2px;background-color:#0e1114;background-repeat:no-repeat}.sg:hover,.pp:hover{border-color:var(--a)}
.sg{width:44px;height:50px;background-image:url(assets/sga_sprite.png);background-size:1144px 50px}
.pp{width:44px;height:44px;background-image:url(assets/pigpen_sprite.png);background-size:1144px 44px}
.gl{display:inline-block;margin:1px}.out{font:bold 22px monospace;color:#e9edf0;letter-spacing:.16em;min-height:34px;border-bottom:1px solid var(--ln);margin:8px 0}
.mo{display:inline-flex;align-items:center;gap:4px;margin:3px 18px 3px 0}.mo span{display:inline-block;height:10px;background:var(--a)}.mo b{color:#e9edf0;margin-right:6px;font-weight:normal}
.kr span{display:inline-block;width:26px;text-align:center;border:1px solid var(--ln);margin:0 -1px;font-weight:bold}.kr span.h{background:var(--a);color:#0a0c0e}.kr span.g{background:var(--ok);color:#0a0c0e}
@media(max-width:860px){.sec{overflow-x:auto}#wrap{grid-template-columns:1fr}nav{position:static;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);max-height:none;padding:6px}nav a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}nav a.on{border-bottom-color:var(--a)}main{padding:16px 12px 60px}h2{font-size:20px}}
</style>
</head>

<script>
(function(){
var ANS={1:"MIDNIGHT",2:"LANTERN",3:"WINIFRED",4:"PHANTOM",5:"CATACOMB",6:"HOLLOW",7:"WRAITH",8:"HAUNTING",9:"WHISPERS",10:"UNKNOWNSECRETS"};
var AL="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

function frame(src,h,id,extra){return '<iframe id="'+(id||'')+'" src="'+src+'" style="height:'+h+'px"></iframe><div class="cap"><a href="'+src+'" target="_blank">open this in its own tab</a>'+(extra||'')+'</div>'}
function sec(label,body,cls){return '<div class="sec '+(cls||'')+'"><div class="lab">'+label+'</div>'+body+'</div>'}
function head(n,title,sub){return '<h2>'+(n?'<i>'+n+'</i> ':'')+title+'</h2><div class="sub">'+sub+'</div>'}
function ansBox(a){return '<div class="ans">'+a+'</div>'}
var PZ=[
{id:"overview",n:"",t:"OVERVIEW",render:function(){
 var rows="";for(var k=1;k<=10;k++)rows+='<tr><td>'+k+'</td><td><a href="#'+k+'">'+TITLES[k]+'</a></td><td>'+KIND[k]+'</td><td class="sol-a">'+ANS[k]+'</td></tr>';
 rows+='<tr><td>+</td><td><a href="#secret">THE SECRET ROUND</a></td><td>interactive escape room</td><td class="sol-a">code ALLORNOTHING, answer SHEREMAINS</td></tr>';
 return head("","SERVER404 // THE ARCHIVE","A HALLOWEEN HUNT FOR RECZONE. ENDED. NOBODY CLAIMED IT.")
 +sec("BRIEFING",'<p>This is the whole hunt, exactly as players saw it, with every answer and every step. Use the list on the left, the arrow buttons, or the left and right arrow keys to skip between puzzles. Tick <b>hide solutions</b> at the top if you want to try a puzzle first; click a blurred box to reveal it.</p><p>How it worked: ten puzzles over seven days, each locked behind the answer to the one before. The answer to puzzle 10, <code>UNKNOWNSECRETS</code>, opened a claim page. The claim page had a hidden extra: typing <code>ALLORNOTHING</code> opened a secret escape room worth double the prize, with three attempts and everything lost on a miss.</p>')
 +sec("ALL ANSWERS",'<table><thead><tr><th>#</th><th>PUZZLE</th><th>TYPE</th><th>ANSWER</th></tr></thead><tbody>'+rows+'</tbody></table>','sol')
 +sec("PUZZLE 1 AS POSTED IN DISCORD",'<div class="poem">Something is awake in the RECZONE. Solve what it left behind.\n\nMoths forget the lamp when I arrive,\nIn every clock, both hands point up for me,\nDeep in the dark, I come each day,\nNeither dusk nor dawn can claim me,\nIn graveyards, I\'m the hour the dead stir,\nGraves open wide at my first strike,\nHands stacked at the top, the bells begin,\nTwelve times they ring, and I am here.</div>')
 +sec("HOW THE LOCKS WORKED",'<p class="dim">Each puzzle page was encrypted with a key made from the previous answer, so nothing could be opened early or out of order. Pages unlocked on a timer over seven days.</p>');}},
{id:"1",n:1,t:"MIDNIGHT",render:function(){
 return head(1,"THE INVITATION","TYPE: RIDDLE + ACROSTIC")
 +sec("THE PUZZLE",'<div class="poem">Moths forget the lamp when I arrive,\nIn every clock, both hands point up for me,\nDeep in the dark, I come each day,\nNeither dusk nor dawn can claim me,\nIn graveyards, I\'m the hour the dead stir,\nGraves open wide at my first strike,\nHands stacked at the top, the bells begin,\nTwelve times they ring, and I am here.</div>')
 +sec("SOLUTION",'<ol class="st"><li><b>Read it as a riddle.</b> Both clock hands point straight up, twelve bells ring, the dead stir, graves open at the first strike. All of it describes one moment: the hour when the day turns over.</li><li><b>Confirm with the acrostic.</b> Take the first letter of every line:<div class="poem" style="margin:8px 0"><b>M</b>oths forget the lamp when I arrive,\n<b>I</b>n every clock, both hands point up for me,\n<b>D</b>eep in the dark, I come each day,\n<b>N</b>either dusk nor dawn can claim me,\n<b>I</b>n graveyards, I\'m the hour the dead stir,\n<b>G</b>raves open wide at my first strike,\n<b>H</b>ands stacked at the top, the bells begin,\n<b>T</b>welve times they ring, and I am here.</div>It spells the same word the riddle describes.</li></ol>'+ansBox(ANS[1]),'sol');}},
{id:"2",n:2,t:"LANTERN",render:function(){
 var seq=[["L",".-.."],["A",".-"],["N","-."],["T","-"],["E","."],["R",".-."],["N","-."]],mo="";
 seq.forEach(function(s){mo+='<span class="mo"><b>'+s[0]+'</b>'+s[1].split("").map(function(c){return '<span style="width:'+(c=="."?10:30)+'px"></span>'}).join("")+'</span>'});
 return head(2,"THE STATIC","TYPE: VIDEO + MORSE CODE")
 +sec("THE PUZZLE",'<video controls playsinline preload="metadata" src="assets/cam04.mp4" style="width:100%;max-width:640px"></video><div class="cap">cam04_2347.mp4: a security camera looks down a dark hallway. A lantern at the far end flashes, and a beep plays with each flash.</div>')
 +sec("SOLUTION",'<ol class="st"><li><b>Watch the lantern.</b> Nothing else changes in the video. Only the lantern at the end of the hall turns on and off. Compare these two frames:<div class="row"><div><img src="assets/cam_off.jpg"><div class="cap">lantern off</div></div><div><img src="assets/cam_on.jpg"><div class="cap">lantern on (a figure stands beside it)</div></div></div></li><li><b>Short flash = dot, long flash = dash.</b> The beeps match the light exactly, so you can listen or watch.</li><li><b>Write the pattern down, with a longer gap between letters.</b> It repeats three times, which lets you check your work.<div style="margin:10px 0">'+mo+'</div></li><li><b>Look the pattern up in a Morse chart.</b> The seven letters read L A N T E R N, the thing at the end of the hallway.</li></ol>'+ansBox(ANS[2]),'sol');}},
{id:"3",n:3,t:"WINIFRED",render:function(){
 return head(3,"THE PORTRAIT","TYPE: HIDDEN IMAGE DATA + SYMBOL ALPHABET")
 +sec("THE PUZZLE",'<img src="assets/portrait_07.png" style="max-width:420px"><div class="cap">portrait_07.png: a dark portrait of a woman. The nameplate has been scratched out.</div>')
 +sec("SOLUTION",'<ol class="st"><li><b>Something is hidden in the shadows.</b> The picture is far darker than it needs to be. A message is painted into the dark background above her head, only about 2% brighter than the paint around it, and only in the blue colour channel. Your eyes cannot see it.</li><li><b>Brighten the shadows.</b> Any photo editor (shadows, exposure, levels, curves) will do. Try it here: drag the slider, or press the button.<div style="margin:12px 0"><button id="rv">&#9654; reveal it</button> <label class="dim">brightness boost <input type="range" id="gn" min="1" max="30" value="1"></label> <label class="dim"><input type="checkbox" id="bo"> look at the blue channel only</label></div><canvas id="cv1" style="width:100%;max-width:760px;border:1px solid var(--ln)"></canvas></li><li><b>Recognise the symbols.</b> Once the text appears it is written in the <b>Standard Galactic Alphabet</b>, the "enchanting table" language from Minecraft. A search for "Minecraft enchanting table translator" finds a chart.</li><li><b>Decode it.</b> Use this decoder: click the symbols in order. The message is two lines, <code>HER NAME IS</code> and <code>WINIFRED</code>.<div style="margin:10px 0" id="sgp"></div><div class="out" id="sgo"></div><button id="sgb">backspace</button><button id="sgc">clear</button><div class="cap">The hidden text in the picture is exactly these symbols. Not sure of a glyph? Type letters below to see what each one looks like:</div><input type="text" id="sgi" placeholder="type here" style="max-width:360px"><div id="sgv" style="margin-top:8px"></div></li></ol>'+ansBox(ANS[3]),'sol');},
 init:function(){
  var img=new Image(),c=$("cv1"),x=c.getContext("2d");img.onload=function(){c.width=img.width;c.height=260;var off=document.createElement("canvas");off.width=img.width;off.height=img.height;var ox=off.getContext("2d");ox.drawImage(img,0,0);var src=ox.getImageData(0,30,img.width,260);
   function draw(g,blue){var o=x.createImageData(src.width,src.height),s=src.data,d=o.data;for(var i=0;i<s.length;i+=4){var r=(s[i]-6)*g,gg=(s[i+1]-6)*g,b=(s[i+2]-6)*g;if(blue){r=gg=b}d[i]=r;d[i+1]=gg;d[i+2]=b;d[i+3]=255}x.putImageData(o,0,0)}
   function go(){draw(+$("gn").value,$("bo").checked)}$("gn").oninput=go;$("bo").onchange=go;go();
   $("rv").onclick=function(){var t0=performance.now(),dur=3200;$("bo").checked=true;(function step(now){var u=Math.min(1,(now-t0)/dur);$("gn").value=1+29*u;go();if(u<1)requestAnimationFrame(step)})(t0)}};img.src="assets/portrait_07.png";
  var p=$("sgp"),o=$("sgo");AL.split("").forEach(function(ch,i){var d=document.createElement("span");d.className="sg";d.style.backgroundPosition="-"+(i*44)+"px 0";d.onclick=function(){o.textContent+=ch};p.appendChild(d)});
  $("sgb").onclick=function(){o.textContent=o.textContent.slice(0,-1)};$("sgc").onclick=function(){o.textContent=""};
  $("sgi").oninput=function(){var v=$("sgv");v.innerHTML="";this.value.toUpperCase().replace(/[^A-Z ]/g,"").split("").forEach(function(ch){var d=document.createElement("span");d.className="gl";if(ch==" "){d.style.width="24px";d.style.display="inline-block"}else{d.className="sg";d.style.cursor="default";d.style.backgroundPosition="-"+((ch.charCodeAt(0)-65)*44)+"px 0"}v.appendChild(d)})};}},
{id:"4",n:4,t:"PHANTOM",render:function(){
 return head(4,"THE GUEST LEDGER","TYPE: DATA CROSS-REFERENCE")
 +sec("THE PUZZLE",'<div class="row"><div><img src="assets/register_1923.png"><div class="cap">register_1923.png</div></div><div><img src="assets/floor_2.png"><div class="cap">floor_2.png</div></div></div>')
 +sec("SOLUTION",'<ol class="st"><li><b>Read the red stamp:</b> "NIGHT AUDIT - 31 OCT. Guests still in house, in order of arrival." That is the instruction.</li><li><b>Guests still in house</b> are the ones with <b>no checkout time</b>. Seven of the twelve.</li><li><b>Order of arrival.</b> The register is alphabetical, not chronological, so sort those seven by their check-in date and time.</li><li><b>Room number to door plaque.</b> On the floor plan every door has a brass letter plaque. Look up each guest\'s room and write down its letter.</li></ol><div>Step through it:</div><div style="margin:8px 0"><button data-s="1">1 &middot; no checkout</button><button data-s="2">2 &middot; sort by arrival</button><button data-s="3">3 &middot; room to plaque</button><button data-s="0">reset</button></div><table id="lg"></table>'+ansBox(ANS[4]),'sol');},
 init:function(){
  var G=[["Ashworth, Reginald",103,"Oct 27, 1:05 pm","","A",27.0544],["Bellamy, Theodore",106,"Oct 25, 3:10 pm","","P",25.1319],["Crane, Lucille",111,"Oct 26, 8:40 pm","","H",26.3611],["Dunmore, Silas",101,"Oct 29, 10:15 am","","T",29.4271],["Fenwick, Ada",108,"Oct 28, 6:20 pm","","N",28.7639],["Gray, Harold",102,"Oct 25, 9:00 am","Oct 28, 8:30 am","E",25.375],["Holloway, Cornelius",112,"Oct 30, 9:30 pm","","O",30.8958],["Kemp, Beatrice",107,"Oct 26, 11:20 am","Oct 29, 10:00 am","R",26.4722],["Lowell, Frank",105,"Oct 27, 4:45 pm","Oct 30, 11:15 am","S",27.6979],["Marsh, Winifred",104,"Oct 31, 11:47 pm","","M",31.9910],["Nash, Olive",109,"Oct 28, 2:10 pm","Oct 31, 9:00 am","K",28.5903],["Pell, Walter",110,"Oct 29, 7:55 pm","Oct 31, 8:20 am","D",29.8299]];
  function show(s){var rows=G.slice();if(s>=1)rows=rows.filter(function(r){return !r[3]});if(s>=2)rows.sort(function(a,b){return a[5]-b[5]});var h="<tr><th>GUEST</th><th>ROOM</th><th>IN</th><th>OUT</th>"+(s>=3?"<th>PLAQUE</th>":"")+"</tr>";
   rows.forEach(function(r){h+="<tr><td>"+r[0]+"</td><td>"+r[1]+"</td><td>"+r[2]+"</td><td>"+(r[3]||"&mdash;")+"</td>"+(s>=3&&!r[3]?'<td class="ok"><b>'+r[4]+"</b></td>":(s>=3?"<td></td>":""))+"</tr>"});if(s>=3)h+='<tr><td colspan="5">reading the plaques in order: <b class="ok">'+rows.map(function(r){return r[4]}).join("")+"</b></td></tr>";$("lg").innerHTML=h}
  show(0);Array.prototype.forEach.call(document.querySelectorAll("button[data-s]"),function(b){b.onclick=function(){show(+b.getAttribute("data-s"))}})}},
{id:"5",n:5,t:"CATACOMB",render:function(){
 return head(5,"THE PLAYLIST","TYPE: AUDIO + HIDDEN SPECTROGRAM")
 +sec("THE PUZZLE",'<audio controls preload="none" src="assets/the_haunted_promenade.mp3"></audio><div class="cap">the_haunted_promenade.mp3: the RECZONE soundtrack track, with a download link.</div>')
 +sec("SOLUTION",'<ol class="st"><li><b>Listening gets you nowhere.</b> The track sounds like a normal song. The clue is the puzzle\'s title: a song you can <i>look at</i>.</li><li><b>Open the audio in a spectrogram viewer.</b> A spectrogram draws sound as a picture: time left to right, pitch bottom to top. Free options: Audacity (Spectrogram view), Sonic Visualiser, or any online spectrogram tool.</li><li><b>Look high up.</b> The song\'s music stops at about 15 kHz, so the space above is empty. A word was drawn in sound between <b>16 and 19.6 kHz</b>, from about 0:40 to 1:44. It is too high for most people to hear.<img src="assets/spec_full.png" style="margin-top:10px"><div class="cap">the whole track from 0 to 22 kHz: the music fills the bottom, the bright band near the top is where the word sits</div></li><li><b>Zoom into that band</b> and read it:<img src="assets/spec_zoom.png"><div class="cap">14 to 21.5 kHz, 0:34 to 1:50</div></li></ol>'+ansBox(ANS[5]),'sol');}},
{id:"6",n:6,t:"HOLLOW",render:function(){
 var st=[["H","Josiah Wren (1802-1851)","Rest easy, traveler. Count two stones toward where the sun is born, and rest there.","east, 2 stones"],["O","Mabel Thorne (1859-1888)","I rose with the light. Climb two stones toward the star that never moves.","north, 2 stones"],["L","Ambrose Fell (1844-1902)","Count three stones toward where the sun is buried.","west, 3 stones"],["L","Clara Wickham (1871-1899)","One stone toward the star that never moves. She sleeps lightly.","north, 1 stone"],["O","Gideon Marsh (1830-1877)","Turn toward the gate and walk three stones.","south, 3 stones"],["W","Winifred Marsh (1899-1923)","No further. Say what the stones have spelled.","the end"]],rows="";
 st.forEach(function(s,i){rows+='<tr><td>'+(i+1)+'</td><td><b>'+s[0]+'</b></td><td>'+s[1]+'</td><td>'+s[2]+'</td><td class="ok">'+s[3]+'</td></tr>'});
 return head(6,"THE GRAVEYARD MAP","TYPE: INTERACTIVE MAP + DIRECTIONS")
 +sec("THE PUZZLE (PLAY IT)",frame("assets/map.html",780,"f6",' &middot; click any stone to read it'))
 +sec("SOLUTION",'<ol class="st"><li><b>Read the line under the map:</b> "The caretaker began each night at the stone nearest the gate." That is where you start.</li><li><b>Every epitaph points to the next stone.</b> The directions are riddles: <i>where the sun is born</i> = east, <i>the star that never moves</i> = north (the pole star), <i>where the sun is buried</i> = west, <i>the gate</i> = south (the gate is drawn at the bottom).</li><li>Follow the chain, collecting the carved letters:<table><thead><tr><th>#</th><th></th><th>STONE</th><th>EPITAPH</th><th>MOVE</th></tr></thead><tbody>'+rows+'</tbody></table></li><li>The other 14 stones are decoys: some lead off the edge, some into the chain. The route:<img src="assets/map_solved.png" style="max-width:640px;margin-top:8px"></li></ol>'+ansBox(ANS[6]),'sol');}},
{id:"7",n:7,t:"WRAITH",render:function(){
 return head(7,"THE CATACOMBS","TYPE: 3D HORROR GAME (PLAYABLE)")

e of lines,\nwhere boxes, crosses, dots are signs.\nYet free the words and still they hide,\na second lock is turned inside.\nThe name she kept, the name you found\nin shadow, where the light was drowned,\nwill walk the letters, one by one,\nback to the place where each begun.</div>'+ansBox(ANS[9]),'sol');},
